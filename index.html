<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101820" />
    <title>開発会社をつくる</title>
    <style>
      :root {
        --bg: #101820;
        --panel: #182430;
        --panel-hi: #21303f;
        --line: #2f4356;
        --text: #eaf2f8;
        --muted: #8ba3ba;
        --accent: #ffcb47;
        --pop: #7fe3a0;
        --crit: #ff8a5c;
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }

      body {
        margin: 0;
        padding: calc(18px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Hiragino Sans', sans-serif;
        font-size: 14px;
      }

      main { max-width: 480px; margin: 0 auto; display: grid; gap: 12px; }

      h1 {
        font-size: 14px; font-weight: 700; letter-spacing: 0.12em;
        color: var(--muted); text-align: center; margin: 0;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
      }

      .label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }

      /* --- 選択肢 --- */
      .choices { display: flex; gap: 6px; flex-wrap: wrap; }

      .choice {
        flex: 1 1 auto;
        min-width: 92px;
        padding: 10px 8px;
        background: var(--panel-hi);
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--text);
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
        text-align: center;
      }

      .choice[aria-pressed='true'] {
        border-color: var(--accent);
        background: #2c3a2a;
      }

      .choice-emoji { display: block; font-size: 20px; }
      .choice-sub { display: block; font-size: 11px; color: var(--muted); }
      .choice-level { display: block; font-size: 11px; font-weight: 800; color: var(--accent); }

      /* 過去に試した相性の印。試していないものは伏せたままにする */
      .choice-memo { display: block; font-size: 13px; font-weight: 800; }
      .memo-great { color: var(--pop); }
      .memo-good { color: var(--accent); }
      .memo-normal { color: var(--muted); }
      .memo-bad { color: var(--crit); }
      .memo-unknown { color: var(--line); }
      .choice-skills { display: block; font-size: 12px; }

      /* --- 会社の状況（常に見えている） --- */
      #hud {
        display: flex; align-items: center; gap: 10px;
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 10px; padding: 10px 14px;
      }
      #hud-date { font-size: 12px; color: var(--muted); }
      #hud-funds {
        flex: 1; text-align: right;
        font-size: 18px; font-weight: 800; color: var(--accent);
        font-variant-numeric: tabular-nums;
      }
      #hud-funds.danger { color: var(--crit); }
      #hud-staff { font-size: 12px; color: var(--muted); }

      /* --- 依頼 --- */
      #offers { display: grid; gap: 6px; }

      .offer {
        display: grid; gap: 4px;
        padding: 11px 13px; text-align: left;
        background: var(--panel-hi); border: 1px solid var(--line);
        border-radius: 10px; color: var(--text);
        font-family: inherit; font-size: 13px; cursor: pointer;
      }
      .offer[aria-pressed='true'] { border-color: var(--accent); background: #2c3a2a; }
      .offer:disabled { opacity: 0.35; cursor: not-allowed; }

      .offer-top { display: flex; align-items: baseline; gap: 8px; }
      .offer-client { font-weight: 700; flex: 1; }
      .offer-reward {
        font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums;
      }
      .offer-sub { font-size: 11px; color: var(--muted); }

      /* 依頼の条件。色で種類が分かるようにする */
      .offer-tag {
        font-size: 11px; font-weight: 700;
        padding: 4px 8px; border-radius: 6px;
        background: #0e1620;
      }
      .cond-rush { color: var(--crit); }
      .cond-nurture { color: var(--pop); }
      .cond-strict { color: var(--accent); }

      /* --- 年度末の決算 --- */
      #yearend { display: grid; gap: 12px; text-align: center; }

      #yearend-title { margin: 0; font-size: 15px; color: var(--muted); letter-spacing: 0.1em; }
      #yearend-headline { margin: 0; font-size: 24px; font-weight: 900; }

      #yearend-rows { display: grid; gap: 4px; text-align: left; }
      #yearend-grown { display: grid; gap: 4px; text-align: left; }

      .yearend-grown-row {
        display: flex; align-items: center; gap: 8px;
        background: var(--panel-hi); border-radius: 6px;
        padding: 6px 12px; font-size: 13px;
      }
      .yearend-grown-row b { color: var(--accent); font-variant-numeric: tabular-nums; }

      /* --- 精算 --- */
      #settle { display: grid; gap: 4px; text-align: left; }
      .settle-row {
        display: flex; justify-content: space-between;
        font-size: 13px; padding: 5px 12px;
        background: var(--panel-hi); border-radius: 6px;
        font-variant-numeric: tabular-nums;
      }
      .settle-row.total { font-weight: 800; font-size: 15px; }
      .settle-row .plus { color: var(--pop); }
      .settle-row .minus { color: var(--crit); }

      /* --- 開発中の舞台。ここが今回の主役 --- */
      #stage {
        position: relative;
        height: 190px;
        background: linear-gradient(180deg, #16222e, #101820);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }

      .desk {
        position: absolute;
        bottom: 26px;
        display: grid;
        justify-items: center;
        gap: 2px;
        width: 33%;
      }

      .desk-emoji {
        font-size: 34px;
        line-height: 1;
        display: block;
      }

      /* 作業中はずっと小刻みに動かす。止まっていると「生きていない」感じになる */
      .desk-emoji.working { animation: tap 0.55s ease-in-out infinite; }

      @keyframes tap {
        0%, 100% { transform: translateY(0) rotate(-2deg); }
        50% { transform: translateY(-3px) rotate(2deg); }
      }

      .desk-name { font-size: 11px; color: var(--muted); }

      /* 飛ぶ数字。これを気持ちよくするのが段階1の目的 */
      .pop {
        position: absolute;
        font-weight: 800;
        font-size: 15px;
        color: var(--pop);
        pointer-events: none;
        white-space: nowrap;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        animation: float-up 0.9s ease-out forwards;
      }

      .pop.crit {
        color: var(--crit);
        font-size: 21px;
      }

      @keyframes float-up {
        0%   { transform: translate(-50%, 0) scale(0.7); opacity: 0; }
        18%  { transform: translate(-50%, -10px) scale(1.15); opacity: 1; }
        100% { transform: translate(-50%, -60px) scale(1); opacity: 0; }
      }

      /* --- 進捗 --- */
      .track {
        height: 8px; background: #0a1119; border-radius: 99px; overflow: hidden;
      }
      #progress-bar {
        height: 100%; width: 0%; background: var(--accent); transition: width 0.15s linear;
      }

      /* --- 4指標 --- */
      #stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }

      .stat {
        background: var(--panel-hi);
        border-radius: 10px;
        padding: 9px 11px;
        display: flex; align-items: baseline; gap: 8px;
      }

      .stat-label { font-size: 12px; color: var(--muted); flex: 1; }

      .stat-value {
        font-size: 19px; font-weight: 800;
        font-variant-numeric: tabular-nums;
        transition: transform 0.12s ease, color 0.12s ease;
      }

      /* 増えた瞬間だけ跳ねさせる。数字が「動いた」ことを見逃さないように */
      .stat-value.bump { transform: scale(1.3); color: var(--pop); }

      /* --- ボタン --- */
      button.main {
        width: 100%; padding: 16px;
        font-family: inherit; font-size: 16px; font-weight: 800;
        background: var(--accent); color: #23180a;
        border: none; border-radius: 10px; cursor: pointer;
        touch-action: manipulation; -webkit-user-select: none; user-select: none;
      }
      button.main:disabled { opacity: 0.4; cursor: not-allowed; }

      button.sub {
        width: 100%; padding: 12px;
        font-family: inherit; font-size: 13px; font-weight: 600;
        background: var(--panel-hi); color: var(--text);
        border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
      }

      /* --- 結果 --- */
      #result { display: grid; gap: 12px; text-align: center; }

      #result-headline { font-size: 26px; font-weight: 900; margin: 0; }
      #result-sales { font-size: 15px; color: var(--accent); font-weight: 700; }

      .review {
        display: flex; align-items: center; gap: 10px;
        background: var(--panel-hi); border-radius: 8px;
        padding: 8px 12px; font-size: 13px; text-align: left;
      }
      .review-score {
        font-weight: 800; font-size: 17px; color: var(--accent);
        font-variant-numeric: tabular-nums; min-width: 34px;
      }
      .review-comment { color: var(--muted); font-size: 12px; }

      /* --- 成長（案件が終わったあと） --- */
      #growth { display: grid; gap: 6px; text-align: left; }

      .grow-row {
        display: flex; align-items: center; gap: 10px;
        background: var(--panel-hi); border-radius: 8px; padding: 8px 12px;
        /* 1件ずつ順に出す。まとめて出すと「育った」感じが流れてしまう */
        opacity: 0;
        animation: grow-in 0.35s ease-out forwards;
      }

      @keyframes grow-in {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .grow-emoji { font-size: 22px; }
      .grow-body { flex: 1; display: grid; gap: 3px; }
      .grow-name { font-size: 13px; font-weight: 700; }
      .grow-exp { font-size: 11px; color: var(--muted); }

      .grow-level {
        font-size: 12px; font-weight: 800; color: var(--accent);
      }

      /* レベルアップは目立たせる。ここがカイロ系のごほうび */
      .grow-row.levelup { border: 1px solid var(--accent); }
      .grow-row.levelup .grow-level { font-size: 15px; }

      .grow-track { height: 5px; background: #0a1119; border-radius: 99px; overflow: hidden; }
      .grow-fill { height: 100%; background: var(--pop); }

      .grow-skill {
        font-size: 12px; font-weight: 700; color: var(--pop);
      }

      #affinity-hint {
        font-size: 13px; font-weight: 700; padding: 10px;
        background: var(--panel-hi); border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>開 発 会 社 を つ く る</h1>

      <div id="hud">
        <span id="hud-date"></span>
        <span id="hud-staff"></span>
        <span id="hud-funds"></span>
      </div>

      <!-- ① 案件を決める -->
      <section id="setup">
        <div class="panel">
          <div class="label" id="offers-label">どの依頼を受ける？</div>
          <div id="offers"></div>
        </div>
        <div class="panel" style="margin-top: 10px">
          <div class="label">なんの技術でつくる？</div>
          <div class="choices" id="tech-choices"></div>
        </div>
        <div class="panel" style="margin-top: 10px" id="hire-panel" hidden>
          <div class="label" id="hire-label"></div>
          <div class="choices" id="hire-choices"></div>
        </div>
        <div class="panel" style="margin-top: 10px">
          <div class="label" id="staff-label">だれにやってもらう？（3人まで）</div>
          <div class="choices" id="staff-choices"></div>
        </div>
        <button class="main" id="start" type="button" style="margin-top: 10px" disabled>
          つくりはじめる
        </button>
      </section>

      <!-- ② 開発中 -->
      <section id="develop" hidden>
        <div id="stage"></div>
        <div class="track" style="margin-top: 10px"><div id="progress-bar"></div></div>
        <div id="stats" style="margin-top: 10px"></div>
      </section>

      <!-- ③ 結果 -->
      <section id="result" class="panel" hidden>
        <h2 id="result-headline"></h2>
        <div id="result-sales"></div>
        <div id="reviews" style="display: grid; gap: 6px"></div>
        <div id="affinity-hint"></div>
        <div class="label" style="text-align: left; margin-top: 4px">精算</div>
        <div id="settle"></div>
        <div class="label" style="text-align: left; margin-top: 4px">メンバーの成長</div>
        <div id="growth"></div>
        <button class="sub" id="again" type="button">つぎの案件へ</button>
      </section>

      <!-- ④ 年度末の決算 -->
      <section id="yearend" class="panel" hidden>
        <h2 id="yearend-title"></h2>
        <div id="yearend-headline"></div>
        <div id="yearend-rows"></div>
        <div class="label" style="text-align: left; margin-top: 4px">ことしの成長</div>
        <div id="yearend-grown"></div>
        <button class="main" id="yearend-next" type="button">つぎの年度へ</button>
      </section>

      <!-- ⑤ 倒産 -->
      <section id="gameover" class="panel" hidden style="text-align: center; display: grid; gap: 12px">
        <h2 style="margin: 0; font-size: 22px">資金が尽きました</h2>
        <div id="gameover-detail" style="font-size: 13px; color: var(--muted)"></div>
        <button class="main" id="restart" type="button">もう一度はじめる</button>
      </section>
    </main>

    <script type="module" src="./src/ui.js"></script>
  </body>
</html>
