<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8ecae6" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 丸ゴシック。カイロソフト系の見た目はドット絵フォントではなく、
         角の丸い太めのゴシックに近い。漢字が多い日本語でも読みやすい -->
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap"
      rel="stylesheet"
    />
    <title>開発会社物語 — 受けて、つくって、育てる</title>
    <style>
      :root {
        /* カイロソフト系の見た目に寄せた配色。
           暗いフラットUIだと「経営シム」ではなく「ツール」に見えるので、
           空・芝・クリーム色の明るい面で組み直している */
        --sky: #8ecae6;
        --sky-deep: #62b0d4;
        --ground: #a8d55d;
        --bg: #f3e9d2;
        --panel: #fffdf5;
        --panel-hi: #ffeec2;
        --line: #6b4a2f;
        --line-soft: #b99b72;
        --text: #3b2f22;
        --muted: #8a7862;
        --accent: #f4820b;
        --pop: #2f9e44;
        --crit: #d64545;
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }

      body {
        margin: 0;
        padding: calc(18px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
        /* 上が空、下に向かってクリーム。屋外から社内へ、という奥行きを出す */
        background: linear-gradient(180deg, var(--sky) 0%, var(--sky) 90px, var(--bg) 200px);
        background-attachment: fixed;
        color: var(--text);
        font-family: 'M PLUS Rounded 1c', system-ui, 'Hiragino Maru Gothic ProN', sans-serif;
        font-weight: 500;
        font-size: 15px;
        line-height: 1.6;
      }

      main { max-width: 480px; margin: 0 auto; display: grid; gap: 12px; }

      h1 {
        font-size: 21px; font-weight: 800; letter-spacing: 0.16em;
        color: #fffdf5; text-align: center; margin: 0;
        /* 縁取り文字。ドット絵の看板っぽさが出る */
        text-shadow: 2px 2px 0 var(--line), -1px -1px 0 var(--line),
                     1px -1px 0 var(--line), -1px 1px 0 var(--line);
      }

      /* 角丸を減らし、影をぼかさない。これだけで「箱」らしさが出る */
      .panel {
        background: var(--panel);
        border: 3px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        box-shadow: 0 4px 0 var(--line);
      }

      .label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }

      /* --- 選択肢 --- */
      .choices { display: flex; gap: 6px; flex-wrap: wrap; }

      /* 押し込める見た目にする。影を消して1px下げると「押した」感じが出る */
      .choice {
        flex: 1 1 auto;
        min-width: 92px;
        padding: 10px 8px;
        background: var(--panel-hi);
        border: 2px solid var(--line);
        border-radius: 6px;
        box-shadow: 0 3px 0 var(--line-soft);
        color: var(--text);
        font-family: inherit;
        font-size: 14px;
        cursor: pointer;
        text-align: center;
        transition: transform 0.06s, box-shadow 0.06s;
      }

      .choice:active {
        transform: translateY(3px);
        box-shadow: none;
      }

      .choice[aria-pressed='true'] {
        background: var(--panel-hi);
        border-color: var(--accent);
        box-shadow: 0 3px 0 var(--accent), inset 0 0 0 2px var(--accent);
      }

      .choice-emoji { display: block; font-size: 20px; }
      .choice-sub { display: block; font-size: 11px; color: var(--muted); }
      .choice-level { display: block; font-size: 11px; font-weight: 800; color: var(--accent); }

      /* 過去に試した相性の印。試していないものは伏せたままにする */
      .choice-memo { display: block; font-size: 13px; font-weight: 800; }
      .memo-great { color: var(--pop); }
      .memo-good { color: var(--accent); }
      .memo-normal { color: var(--muted); }
      .memo-bad { color: var(--crit); }
      .memo-unknown { color: var(--line); }
      .choice-skills { display: block; font-size: 12px; }

      /* --- 会社の状況（常に見えている） --- */
      #hud {
        display: flex; align-items: center; gap: 10px;
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 10px; padding: 10px 14px;
      }
      #hud-date { font-size: 12px; color: var(--muted); }
      #hud-funds {
        flex: 1; text-align: right;
        font-size: 18px; font-weight: 800; color: var(--accent);
        font-variant-numeric: tabular-nums;
      }
      #hud-funds.danger { color: var(--crit); }
      #hud-staff { font-size: 12px; color: var(--muted); }

      /* 買った設備。オフィスに置いたものが並ぶ */
      #facility-owned { font-size: 18px; letter-spacing: 4px; }

      #mute {
        background: var(--panel-hi);
        border: 2px solid var(--line);
        border-radius: 6px;
        padding: 2px 7px;
        font-size: 15px;
        cursor: pointer;
        line-height: 1.3;
      }
      #mute[aria-pressed='true'] { opacity: 0.45; }

      /* --- 依頼 --- */
      #offers { display: grid; gap: 6px; }

      .offer {
        display: grid; gap: 4px;
        padding: 11px 13px; text-align: left;
        background: var(--panel-hi); border: 1px solid var(--line);
        border-radius: 10px; color: var(--text);
        font-family: inherit; font-size: 13px; cursor: pointer;
      }
      /* 選択は「反転」ではなく「強調」にする。
         塗りつぶすと、中の文字色を一つずつ上書きする羽目になり、
         どれかを取りこぼした瞬間に読めなくなる */
      .offer[aria-pressed='true'] {
        border-color: var(--accent);
        background: var(--panel-hi);
        box-shadow: inset 0 0 0 2px var(--accent);
      }
      .offer:disabled { opacity: 0.35; cursor: not-allowed; }

      .offer-top { display: flex; align-items: baseline; gap: 8px; }
      .offer-client { font-weight: 700; flex: 1; }
      .offer-reward {
        font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums;
      }
      .offer-sub { font-size: 11px; color: var(--muted); }

      /* 依頼の条件。色で種類が分かるようにする */
      .offer-tag {
        font-size: 11px; font-weight: 700;
        padding: 4px 8px; border-radius: 6px;
        background: var(--bg);
        border: 2px solid var(--line-soft);
      }
      .cond-rush { color: var(--crit); }
      .cond-nurture { color: var(--pop); }
      .cond-strict { color: var(--accent); }

      /* --- 年度末の決算 --- */
      #yearend { display: grid; gap: 12px; text-align: center; }

      #yearend-title { margin: 0; font-size: 15px; color: var(--muted); letter-spacing: 0.1em; }
      #yearend-headline { margin: 0; font-size: 24px; font-weight: 900; }

      #yearend-rows { display: grid; gap: 4px; text-align: left; }
      #yearend-grown { display: grid; gap: 4px; text-align: left; }

      .yearend-grown-row {
        display: flex; align-items: center; gap: 8px;
        background: var(--panel-hi); border-radius: 6px;
        padding: 6px 12px; font-size: 13px;
      }
      .yearend-grown-row b { color: var(--accent); font-variant-numeric: tabular-nums; }

      /* --- 精算 --- */
      #settle { display: grid; gap: 4px; text-align: left; }
      .settle-row {
        display: flex; justify-content: space-between;
        font-size: 13px; padding: 5px 12px;
        background: var(--panel-hi); border-radius: 6px;
        font-variant-numeric: tabular-nums;
      }
      .settle-row.total { font-weight: 800; font-size: 15px; }
      .settle-row .plus { color: var(--pop); }
      .settle-row .minus { color: var(--crit); }

      /* --- 開発中の舞台。ここが今回の主役 --- */
      /* 開発中の舞台。ただの暗い箱ではなく「オフィスの一室」に見せる。
         壁と床をCSSだけで描き、床はタイル目地を引いて奥行きを出す */
      #stage {
        position: relative;
        height: 210px;
        border: 3px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 4px 0 var(--line);
        overflow: hidden;
        background:
          /* 床のタイル */
          repeating-linear-gradient(90deg, #d9b98a 0 38px, #cdaa79 38px 40px) 0 96px / 100% 114px no-repeat,
          /* 床の下地 */
          linear-gradient(180deg, #cdaa79, #bf9a68) 0 96px / 100% 114px no-repeat,
          /* 壁の腰板 */
          linear-gradient(180deg, #e8d9b5 0 88px, #b98f5f 88px 96px) 0 0 / 100% 96px no-repeat,
          var(--panel);
      }

      /* 壁に貼った窓。外の空が見えると「室内」だと一目で分かる */
      #stage::before {
        content: '';
        position: absolute;
        left: 14px; top: 14px;
        width: 74px; height: 52px;
        background: linear-gradient(180deg, var(--sky), #cfe9f5);
        border: 3px solid var(--line);
        border-radius: 4px;
        box-shadow: inset 0 0 0 2px #fffdf5;
      }

      /* 壁のホワイトボード */
      #stage::after {
        content: '';
        position: absolute;
        right: 14px; top: 18px;
        width: 66px; height: 44px;
        background: #fffdf5;
        border: 3px solid var(--line);
        border-radius: 3px;
      }

      .desk {
        position: absolute;
        bottom: 22px;
        display: grid;
        justify-items: center;
        gap: 0;
        width: 33%;
      }

      /* 机。キャラの足元に置くと、床に座って働いている絵になる */
      .desk-table {
        width: 62px; height: 12px;
        background: #8b5e34;
        border: 3px solid var(--line);
        border-radius: 3px;
        margin-top: -6px;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.18);
      }

      .desk-emoji {
        font-size: 34px;
        line-height: 1;
        display: block;
      }

      /* 作業中はずっと小刻みに動かす。止まっていると「生きていない」感じになる */
      .desk-emoji.working { animation: tap 0.55s ease-in-out infinite; }

      @keyframes tap {
        0%, 100% { transform: translateY(0) rotate(-2deg); }
        50% { transform: translateY(-3px) rotate(2deg); }
      }

      .desk-name {
        font-size: 12px; color: var(--text); margin-top: 3px;
        background: var(--panel); padding: 0 6px;
        border: 2px solid var(--line); border-radius: 99px;
      }

      /* つぶやきの吹き出し。数字とは別の高さに出して、ぶつからないようにする */
      .speech {
        position: absolute;
        transform: translateX(-50%);
        background: var(--panel);
        border: 2px solid var(--line);
        border-radius: 10px;
        padding: 3px 9px;
        font-size: 12px;
        white-space: nowrap;
        pointer-events: none;
        animation: speech-pop 1.9s ease-out forwards;
      }

      /* 吹き出しのしっぽ */
      .speech::after {
        content: '';
        position: absolute;
        left: 50%; bottom: -7px;
        margin-left: -5px;
        border: 5px solid transparent;
        border-top-color: var(--line);
      }

      @keyframes speech-pop {
        0%   { opacity: 0; transform: translateX(-50%) translateY(4px) scale(0.8); }
        12%  { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        80%  { opacity: 1; }
        100% { opacity: 0; }
      }

      /* 飛ぶ数字。これを気持ちよくするのが段階1の目的 */
      .pop {
        position: absolute;
        font-weight: 800;
        font-size: 15px;
        color: var(--pop);
        pointer-events: none;
        white-space: nowrap;
        /* 明るい床の上でも読めるように、影ではなく縁取りにする */
        text-shadow: 2px 2px 0 #fffdf5, -2px -2px 0 #fffdf5,
                     2px -2px 0 #fffdf5, -2px 2px 0 #fffdf5;
        animation: float-up 0.9s ease-out forwards;
      }

      .pop.crit {
        color: var(--crit);
        font-size: 21px;
      }

      @keyframes float-up {
        0%   { transform: translate(-50%, 0) scale(0.7); opacity: 0; }
        18%  { transform: translate(-50%, -10px) scale(1.15); opacity: 1; }
        100% { transform: translate(-50%, -60px) scale(1); opacity: 0; }
      }

      /* --- 進捗 --- */
      .track {
        height: 8px; background: var(--bg); border: 2px solid var(--line-soft);
        border-radius: 99px; overflow: hidden;
      }
      #progress-bar {
        height: 100%; width: 0%; background: var(--accent); transition: width 0.15s linear;
      }
      .track { border: 2px solid var(--line); background: var(--panel-hi); height: 12px; }

      /* --- 4指標 --- */
      #stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }

      .stat {
        background: var(--panel-hi);
        border-radius: 10px;
        padding: 9px 11px;
        display: flex; align-items: baseline; gap: 8px;
      }

      .stat-label { font-size: 12px; color: var(--muted); flex: 1; }

      .stat-value {
        font-size: 19px; font-weight: 800;
        font-variant-numeric: tabular-nums;
        transition: transform 0.12s ease, color 0.12s ease;
      }

      /* 増えた瞬間だけ跳ねさせる。数字が「動いた」ことを見逃さないように */
      .stat-value.bump { transform: scale(1.3); color: var(--pop); }

      /* --- ボタン --- */
      button.main {
        width: 100%; padding: 15px;
        font-family: inherit; font-weight: 800; font-size: 18px; letter-spacing: 0.08em;
        background: var(--accent); color: #fffdf5;
        border: 3px solid var(--line); border-radius: 8px; cursor: pointer;
        box-shadow: 0 5px 0 var(--line);
        text-shadow: 1px 1px 0 #a35606;
        touch-action: manipulation; -webkit-user-select: none; user-select: none;
        transition: transform 0.06s, box-shadow 0.06s;
      }
      button.main:active:not(:disabled) { transform: translateY(5px); box-shadow: none; }
      button.main:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: 0 5px 0 var(--line-soft); }

      button.sub {
        width: 100%; padding: 12px;
        font-family: inherit; font-size: 15px;
        background: var(--panel-hi); color: var(--text);
        border: 3px solid var(--line); border-radius: 8px; cursor: pointer;
        box-shadow: 0 4px 0 var(--line-soft);
      }
      button.sub:active { transform: translateY(4px); box-shadow: none; }

      /* --- 結果 --- */
      #result { display: grid; gap: 12px; text-align: center; }

      #result-headline { font-size: 26px; font-weight: 800; margin: 0; }
      #result-sales { font-size: 15px; color: var(--accent); font-weight: 700; }

      .review {
        display: flex; align-items: center; gap: 10px;
        background: var(--panel-hi); border-radius: 8px;
        padding: 8px 12px; font-size: 13px; text-align: left;
      }
      .review-score {
        font-weight: 800; font-size: 17px; color: var(--accent);
        font-variant-numeric: tabular-nums; min-width: 34px;
      }
      .review-comment { color: var(--muted); font-size: 12px; }

      /* --- 成長（案件が終わったあと） --- */
      #growth { display: grid; gap: 6px; text-align: left; }

      .grow-row {
        display: flex; align-items: center; gap: 10px;
        background: var(--panel-hi); border-radius: 8px; padding: 8px 12px;
        /* 1件ずつ順に出す。まとめて出すと「育った」感じが流れてしまう */
        opacity: 0;
        animation: grow-in 0.35s ease-out forwards;
      }

      @keyframes grow-in {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .grow-emoji { font-size: 22px; }
      .grow-body { flex: 1; display: grid; gap: 3px; }
      .grow-name { font-size: 13px; font-weight: 700; }
      .grow-exp { font-size: 11px; color: var(--muted); }

      .grow-level {
        font-size: 12px; font-weight: 800; color: var(--accent);
      }

      /* レベルアップは目立たせる。ここがカイロ系のごほうび */
      .grow-row.levelup { border: 1px solid var(--accent); }
      .grow-row.levelup .grow-level { font-size: 15px; }

      .grow-track { height: 6px; background: var(--bg); border: 1px solid var(--line-soft); border-radius: 99px; overflow: hidden; }
      .grow-fill { height: 100%; background: var(--pop); }

      .grow-skill {
        font-size: 12px; font-weight: 700; color: var(--pop);
      }

      #affinity-hint {
        font-size: 13px; font-weight: 700; padding: 10px;
        background: var(--panel-hi); border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>開 発 会 社 物 語</h1>

      <div id="hud">
        <span id="hud-date"></span>
        <span id="hud-staff"></span>
        <span id="hud-funds"></span>
        <button id="mute" type="button" aria-label="音のオン・オフ">🔊</button>
      </div>

      <!-- ① 案件を決める -->
      <section id="setup">
        <div class="panel">
          <div class="label" id="offers-label">どの依頼を受ける？</div>
          <div id="offers"></div>
        </div>
        <div class="panel" style="margin-top: 10px">
          <div class="label">なんの技術でつくる？</div>
          <div class="choices" id="tech-choices"></div>
        </div>
        <div class="panel" style="margin-top: 10px" id="facility-panel" hidden>
          <div class="label" id="facility-label"></div>
          <div class="choices" id="facility-choices"></div>
          <div class="label" id="facility-owned" style="margin: 8px 0 0"></div>
        </div>
        <div class="panel" style="margin-top: 10px" id="hire-panel" hidden>
          <div class="label" id="hire-label"></div>
          <div class="choices" id="hire-choices"></div>
        </div>
        <div class="panel" style="margin-top: 10px">
          <div class="label" id="staff-label">だれにやってもらう？（3人まで）</div>
          <div class="choices" id="staff-choices"></div>
        </div>
        <button class="main" id="start" type="button" style="margin-top: 10px" disabled>
          つくりはじめる
        </button>
      </section>

      <!-- ② 開発中 -->
      <section id="develop" hidden>
        <div id="stage"></div>
        <div class="track" style="margin-top: 10px"><div id="progress-bar"></div></div>
        <div id="stats" style="margin-top: 10px"></div>
      </section>

      <!-- ③ 結果 -->
      <section id="result" class="panel" hidden>
        <h2 id="result-headline"></h2>
        <div id="result-sales"></div>
        <div id="reviews" style="display: grid; gap: 6px"></div>
        <div id="affinity-hint"></div>
        <div class="label" style="text-align: left; margin-top: 4px">精算</div>
        <div id="settle"></div>
        <div class="label" style="text-align: left; margin-top: 4px">メンバーの成長</div>
        <div id="growth"></div>
        <button class="sub" id="again" type="button">つぎの案件へ</button>
      </section>

      <!-- ④ 年度末の決算 -->
      <section id="yearend" class="panel" hidden>
        <h2 id="yearend-title"></h2>
        <div id="yearend-headline"></div>
        <div id="yearend-rows"></div>
        <div class="label" style="text-align: left; margin-top: 4px">ことしの成長</div>
        <div id="yearend-grown"></div>
        <button class="main" id="yearend-next" type="button">つぎの年度へ</button>
      </section>

      <!-- ⑤ 倒産 -->
      <section id="gameover" class="panel" hidden style="text-align: center; display: grid; gap: 12px">
        <h2 style="margin: 0; font-size: 22px">資金が尽きました</h2>
        <div id="gameover-detail" style="font-size: 13px; color: var(--muted)"></div>
        <button class="main" id="restart" type="button">もう一度はじめる</button>
      </section>
    </main>

    <script type="module" src="./src/ui.js"></script>
  </body>
</html>
